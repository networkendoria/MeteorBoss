# MeteorBoss ayarları (değiştirdikten sonra /meteor reload yaz)

# Boşluk Çukuru'nun yarıçapı (blok). 6 ile 30 arası
arena-radius: 15

# Meteorun düşmeye başladığı yükseklik (yerden kaç blok yukarıda)
fall-height: 120

# Düşüş süresi (tick, 20 tick = 1 saniye)
fall-ticks: 160

# Boss çıktıktan kaç saniye sonra çukur kapanmaya başlasın
close-delay-seconds: 10

# Çukurun kapanma süresi (saniye). 300 = 5 dakika
close-duration-seconds: 300

# İki etkinlik arasında en az kaç dakika olsun
cooldown-minutes: 30

# /meteor yazınca baktığın yönde kaç blok ileriye düşsün
default-distance: 10

# Başlık ve geri sayım kaç blok yakındaki oyunculara görünsün (0 = dünyadaki herkes)
title-radius: 0

# Çarpma şok dalgası: etki yarıçapı, hasar (2.0 = 1 kalp), savrulma gücü
shock-radius: 28
shock-damage: 2.0
shock-knockback: 1.4

# Otomatik etkinlik: açıksa sunucu kendi kendine rastgele bir yere meteor düşürür
auto-event:
  enabled: false
  # Etkinlikler arası süre (dakika). cooldown-minutes'tan küçük olmasın
  interval-minutes: 120
  # En az kaç oyuncu çevrimiçi olsun
  min-players: 3
  # Rastgele bir oyuncunun kaç blok uzağına düşsün (en az / en çok)
  min-distance: 80
  max-distance: 200
  # Dünya spawn noktasının bu kadar yakınına düşmesin
  avoid-spawn-radius: 300

# Özel model paketi (sadece model-mode: pack iken). Paket: /meteor pack ile plugins/MeteorBoss/typhon-pack.zip yazılır.
# Zip'i bir internet adresine yükle (doğrudan indirme linki) ve buraya yaz. Boş bırakırsan paketi sunucu
# kendisi göndermez (server.properties'teki resource-pack kullanılabilir). Paketi yüklemeyen oyuncu boss'u göremez.
resource-pack:
  url: ""
  sha1: ""
  prompt: "<light_purple>Typhon modeli için paket"

messages:
  super-warning: "<dark_purple>⚠ <light_purple><bold>ʙᴏşʟᴜᴋ ᴘᴀᴛʟᴀᴍᴀsɪ</bold> <gray>geliyor! <white>Uzaklaş!"
  title: "<gradient:#b46bff:#ff5f3d><bold>☄ METEOR ☄</bold></gradient>"
  subtitle: "<gray>Gökyüzünden bir şey düşüyor..."
  countdown: "<gold>☄ Çarpmaya <white>%s</white> saniye"
  called: "<green>Boss başarıyla çağırıldı"
  bossbar: "<gradient:#b46bff:#ff3d6e><bold>✦ ᴛʏᴘʜᴏɴ ✦</bold></gradient> <gray>│ <white>ᴇᴠʀᴇ %phase%"

boss:
  # Can: temel can + oyuncu başına ek can (en fazla 1024)
  health: 600
  health-per-player: 100
  # Boss'un vuruş hasarı (2 = 1 kalp) ve tek vuruşta verebileceği en yüksek hasar
  melee-damage: 8
  max-hit: 10
  speed: 0.27
  # Çıkış sahnesi süresi (tick)
  emerge-ticks: 80
  # Çıktığı çukurdan en fazla kaç blok uzaklaşabilir
  roam-limit: 50
  # Hasar almadan kaç saniye sonra can yenilemeye başlasın
  heal-idle-seconds: 10
  # Saniyede maksimum canın yüzde kaçı yenilensin (4 kristal sağlamken)
  heal-percent-per-second: 2
  # Toplamda en fazla maksimum canın yüzde kaçı yenilenebilir
  heal-cap-percent: 50
  # Lav, ateş, patlama gibi tuzaklardan gelen tek hasarın üst sınırı
  trap-damage-cap: 2
  # Saldırı hasarları
  slam-damage: 6
  strike-damage: 5
  # Saldırılar arası bekleme (saniye)
  attack-cooldown-seconds: 8
  # Görünüm modu: "blocks" = vanilla bloklardan (paket gerekmez), "pack" = özel model (resource pack gerekir)
  model-mode: blocks
  # Model hangi yöne baksın: boss arkası dönük görünüyorsa 0 yap, 180 normal
  model-yaw-offset: 180
  # Görünüm kalitesi (sadece blocks modunda): high (~60 parça), medium (~45), low (~30). Sunucu kasarsa düşür
  model-quality: high
  # Süper saldırı "Boşluk Patlaması": hazırlanırken boss'a kimse vuramaz, sonra herkesi savurur
  super:
    # Boss çıktıktan kaç saniye sonra ilk süper
    first-seconds: 300
    # Süperler arası süre (300 = 5 dakika)
    interval-seconds: 300
    # Hazırlanma süresi (kalkan açık)
    charge-seconds: 5
    # Patlama yarıçapı (3. evrede radius-phase3)
    radius: 30
    radius-phase3: 40
    # Hasar (2 = 1 kalp, max-hit ile sınırlı) ve savrulma gücü
    damage: 6
    knockback: 2.2
    # Süperden sonra boss kaç saniye yorgun kalsın (yavaş, fazla hasar alır)
    exhausted-seconds: 5
    exhausted-bonus-percent: 25
    # 3. evreye geçince hiç süper yapılmadıysa hemen yapsın
    force-on-phase3: true
    # Uyarı yazısı kaç blok yakındakilere görünsün
    warning-radius: 70
  # Boss barı kaç blok yakındaki oyunculara görünsün
  bar-radius: 150
  # Boss ölünce yere düşen ödüller (EŞYA:ADET)
  rewards:
    - "GOLD_INGOT:5"
    - "DIAMOND:10"
  exp: 300

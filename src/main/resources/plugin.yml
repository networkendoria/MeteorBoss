name: MeteorBoss
version: '${project.version}'
main: com.zyven.meteorboss.MeteorBossPlugin
api-version: '26.2'
folia-supported: true
author: Zyven
description: Meteor düşme ve boss etkinliği

commands:
  meteor:
    description: Meteor etkinliği komutları
    usage: /meteor [x z] | /meteor reload | /meteor etkinlik [-z|-k] | /meteor debug
    permission: meteorboss.admin

permissions:
  meteorboss.admin:
    description: Meteor komutlarını kullanma izni
    default: op

name: MeteorBoss
version: '${version}'
main: com.zyven.meteorboss.MeteorBossPlugin
api-version: '26.2'
folia-supported: true
author: Zyven
description: Meteor düşme ve boss etkinliği

commands:
  meteor:
    description: Meteor etkinliği komutları
    usage: /meteor [dünya x y z] | /meteor reload | /meteor etkinlik [-z|-k] | /meteor debug
    permission: typhonboss

permissions:
  typhonboss:
    description: Typhon/meteor komutlarını kullanma izni
    default: op
